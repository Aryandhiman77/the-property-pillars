server {
    listen 80;
    server_name thepropertypillars.com;

    client_max_body_size 2048m;

    access_log /var/log/nginx/thepropertypillars-access.log;
    error_log /var/log/nginx/thepropertypillars-error.log;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Property images and video uploads
    location = /api/v1/uploads {
        client_max_body_size 1024m;
        client_body_timeout 120s;

        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://127.0.0.1:4301;
    }

    # Express Backend API
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4301;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://127.0.0.1:3301;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}